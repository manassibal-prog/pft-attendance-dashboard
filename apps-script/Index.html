<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root{--blue:#1f4e78;--green:#1e7e34;--red:#c0392b;--amber:#b7791f;--grey:#666;}
    *{box-sizing:border-box;}
    body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f4f6f8;color:#222;}
    .wrap{max-width:460px;margin:0 auto;padding:24px 16px;min-height:100vh;}
    .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:16px;}
    h1{font-size:18px;color:var(--blue);margin:0 0 4px;}
    .sub{color:var(--grey);font-size:13px;margin-bottom:16px;}
    .clock{font-size:28px;font-weight:bold;text-align:center;color:var(--blue);margin:8px 0;}
    .row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #eee;}
    .row:last-child{border-bottom:none;}
    .label{color:var(--grey);}
    button{width:100%;padding:15px;font-size:15px;font-weight:bold;border:none;border-radius:10px;color:#fff;margin-top:10px;cursor:pointer;}
    .btn-in{background:var(--green);}
    .btn-out{background:var(--red);}
    .btn-break{background:var(--amber);}
    .btn-end{background:var(--blue);}
    button:disabled{background:#bbb;cursor:not-allowed;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
    .grid2 button{margin-top:0;}
    .status{text-align:center;font-size:13px;margin-top:10px;padding:10px;border-radius:8px;}
    .ok{background:#e6f4ea;color:var(--green);}
    .err{background:#fdecea;color:var(--red);}
    .info{background:#fff4e0;color:var(--amber);}
    .loading{text-align:center;color:var(--grey);padding:60px 0;}
    .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:bold;}
    .badge-ok{background:#e6f4ea;color:var(--green);}
    .badge-bad{background:#fdecea;color:var(--red);}
    .refresh{display:block;text-align:center;font-size:12px;color:var(--blue);margin-top:6px;text-decoration:none;}
    .phasebar{text-align:center;font-weight:bold;padding:8px;border-radius:8px;margin-bottom:6px;}
    .phase-working{background:#e6f4ea;color:var(--green);}
    .phase-break{background:#fff4e0;color:var(--amber);}
    .phase-idle{background:#eee;color:var(--grey);}
    .phase-done{background:#e8f0fe;color:var(--blue);}
    .tabs{display:flex;gap:8px;margin-bottom:16px;}
    .tab{flex:1;text-align:center;padding:10px;border-radius:10px;background:#fff;color:var(--grey);font-weight:bold;font-size:13px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);}
    .tab.active{background:var(--blue);color:#fff;}
    .team-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;font-size:13px;}
    .team-row:last-child{border-bottom:none;}
    .team-name{font-weight:bold;}
    .team-sub{color:var(--grey);font-size:11px;}
    .status-pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:bold;white-space:nowrap;}
    .st-Present{background:#e6f4ea;color:var(--green);}
    .st-Working{background:#e6f4ea;color:var(--green);}
    .st-Late{background:#fdecea;color:var(--red);}
    .st-HalfDay{background:#fff4e0;color:var(--amber);}
    .st-LunchBreak,.st-TeaBreak,.st-BioBreak{background:#fff4e0;color:var(--amber);}
    .st-WO{background:#eee;color:var(--grey);}
    .st-Holiday{background:#eee;color:var(--grey);}
    .st-L,.st-UP{background:#e8f0fe;color:var(--blue);}
    .st-NotStarted{background:#eee;color:var(--grey);}
  </style>
</head>
<body>
  <div class="wrap"><div id="app" class="loading">Loading…</div></div>

<script>
let EMP = null;
let IS_MANAGER = false;
let LAST_LOC = null;
let LOC_INFO = null;
let STATE = { phase: 'not_started', breakType: null, punchIn: null, punchOut: null, breakTotals: { LUNCH: 0, TEA: 0, BIO: 0 }, rosterCode: '', requiresGeofence: true };
let ACTIVE_TAB = 'me';
let TEAM = null;
let RECENT_LOG = null;
let teamPollHandle = null;

const BREAK_LABEL = { LUNCH: 'Lunch Break', TEA: 'Tea Break', BIO: 'Bio Break' };

function boot() {
  google.script.run.withSuccessHandler(onUser).withFailureHandler(onFatal).getCurrentUser();
}

function onFatal(err) {
  document.getElementById('app').innerHTML =
    '<div class="card"><h1>Something went wrong</h1><div class="status err">' + err.message + '</div></div>';
}

function onUser(res) {
  if (res.error) {
    document.getElementById('app').innerHTML =
      '<div class="card"><h1>Access denied</h1><div class="status err">' + res.error + '</div></div>';
    return;
  }
  EMP = res.emp;
  IS_MANAGER = !!res.isManager;
  renderShell();
  refreshDayState();
  requestLocation();
  setInterval(function () { const el = document.getElementById('clock'); if (el) el.textContent = new Date().toLocaleTimeString(); }, 1000);
}

function refreshDayState() {
  google.script.run.withSuccessHandler(function (s) { STATE = s; renderMe(); }).getDayState();
}

function requestLocation() {
  if (!navigator.geolocation) {
    LOC_INFO = { error: 'Your browser does not support location access.' };
    renderMe();
    return;
  }
  navigator.geolocation.getCurrentPosition(function (pos) {
    LAST_LOC = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    google.script.run.withSuccessHandler(function (info) { LOC_INFO = info; renderMe(); }).checkLocation(LAST_LOC.lat, LAST_LOC.lng);
  }, function () {
    LOC_INFO = { error: 'Location permission denied or unavailable. Enable location access and reload this page.' };
    renderMe();
  }, { enableHighAccuracy: true, timeout: 15000 });
}

function fmtTime(v) { return v ? new Date(v).toLocaleTimeString() : '—'; }

function renderShell() {
  if (!IS_MANAGER) {
    // Advisors get their own attendance only — no tab bar, no way to reach
    // the team view even by URL/console tricks, since the server rejects
    // getTeamStatus/getRecentLog for non-managers regardless of the UI.
    document.getElementById('app').innerHTML = '<div id="tabBody"></div>';
    switchTab('me');
    return;
  }
  document.getElementById('app').innerHTML =
    '<div class="tabs"><div class="tab" id="tabMe">My Attendance</div><div class="tab" id="tabTeam">Team Status</div></div><div id="tabBody"></div>';
  document.getElementById('tabMe').addEventListener('click', function () { switchTab('me'); });
  document.getElementById('tabTeam').addEventListener('click', function () { switchTab('team'); });
  switchTab('me');
}

function switchTab(tab) {
  ACTIVE_TAB = tab;
  const tabMe = document.getElementById('tabMe');
  const tabTeam = document.getElementById('tabTeam');
  if (tabMe) tabMe.classList.toggle('active', tab === 'me');
  if (tabTeam) tabTeam.classList.toggle('active', tab === 'team');
  if (teamPollHandle) { clearInterval(teamPollHandle); teamPollHandle = null; }
  if (tab === 'me') {
    renderMe();
  } else {
    renderTeam();
    loadTeam();
    teamPollHandle = setInterval(loadTeam, 20000);
  }
}

function renderMe() {
  if (ACTIVE_TAB !== 'me') return;
  const body = document.getElementById('tabBody');
  if (!body) return;

  let html = '<div class="card"><h1>' + EMP.name + '</h1><div class="sub">' + EMP.email + ' &middot; ' + (EMP.empId || '') + '</div>';
  html += '<div id="clock" class="clock">' + new Date().toLocaleTimeString() + '</div>';
  html += '<div class="row"><span class="label">Date</span><span>' + new Date().toLocaleDateString() + '</span></div>';

  const requiresGeofence = STATE.requiresGeofence !== false;
  if (!requiresGeofence) {
    html += '<div class="status info">Today is marked WFH in Roster — location check is not required.</div>';
  } else if (LOC_INFO && LOC_INFO.error) {
    html += '<div class="status err">' + LOC_INFO.error + '</div>';
  } else if (LOC_INFO) {
    html += '<div class="row"><span class="label">Distance from office</span><span>' + LOC_INFO.distance + ' m</span></div>';
    html += '<div class="row"><span class="label">Geofence</span><span class="badge ' + (LOC_INFO.within ? 'badge-ok">Within Range' : 'badge-bad">Out of Range') + '</span></div>';
  } else {
    html += '<div class="status info">Getting your location…</div>';
  }
  html += '<a href="#" class="refresh" id="refreshLoc">Refresh location</a></div>';

  const phaseText = {
    not_started: STATE.rosterCode ? 'Not punched in (Roster: ' + STATE.rosterCode + ')' : 'Not punched in',
    working: 'Working',
    on_break: STATE.breakType ? BREAK_LABEL[STATE.breakType] : 'On Break',
    completed: 'Day complete'
  }[STATE.phase];
  const phaseClass = { not_started: 'phase-idle', working: 'phase-working', on_break: 'phase-break', completed: 'phase-done' }[STATE.phase];

  html += '<div class="card">';
  html += '<div class="phasebar ' + phaseClass + '">' + phaseText + '</div>';
  html += '<div class="row"><span class="label">Punch In</span><span>' + fmtTime(STATE.punchIn) + '</span></div>';
  html += '<div class="row"><span class="label">Punch Out</span><span>' + fmtTime(STATE.punchOut) + '</span></div>';
  html += '<div class="row"><span class="label">Lunch Break</span><span>' + Math.round((STATE.breakTotals && STATE.breakTotals.LUNCH) || 0) + ' min</span></div>';
  html += '<div class="row"><span class="label">Tea Break</span><span>' + Math.round((STATE.breakTotals && STATE.breakTotals.TEA) || 0) + ' min</span></div>';
  html += '<div class="row"><span class="label">Bio Break</span><span>' + Math.round((STATE.breakTotals && STATE.breakTotals.BIO) || 0) + ' min</span></div>';

  const canAct = !requiresGeofence || (LOC_INFO && !LOC_INFO.error && LOC_INFO.within);
  const dis = canAct ? '' : 'disabled';

  if (STATE.phase === 'not_started') {
    html += '<button class="btn-in" data-type="PUNCH_IN" ' + dis + '>Punch In</button>';
  } else if (STATE.phase === 'working') {
    html += '<div class="grid2">';
    html += '<button class="btn-break" data-type="LUNCH_START" ' + dis + '>Start Lunch Break</button>';
    html += '<button class="btn-break" data-type="TEA_START" ' + dis + '>Start Tea Break</button>';
    html += '</div>';
    html += '<button class="btn-break" data-type="BIO_START" ' + dis + '>Start Bio Break</button>';
    html += '<button class="btn-out" data-type="PUNCH_OUT" ' + dis + '>Punch Out</button>';
  } else if (STATE.phase === 'on_break') {
    html += '<button class="btn-end" data-type="' + STATE.breakType + '_END" ' + dis + '>End ' + BREAK_LABEL[STATE.breakType] + '</button>';
  } else if (STATE.phase === 'completed') {
    html += '<div class="status ok">You have completed attendance for today.</div>';
  }
  if (!canAct && STATE.phase !== 'completed') {
    html += '<div class="status err">You must be within office range to punch in/out or take a break.</div>';
  }
  html += '<div id="msg"></div></div>';

  body.innerHTML = html;
  document.getElementById('refreshLoc').addEventListener('click', function (e) { e.preventDefault(); LOC_INFO = null; renderMe(); requestLocation(); });
  document.querySelectorAll('button[data-type]').forEach(function (btn) {
    btn.addEventListener('click', function () { onAction(btn.getAttribute('data-type'), btn); });
  });
}

function onAction(type, btn) {
  document.querySelectorAll('button[data-type]').forEach(function (b) { b.disabled = true; });
  btn.textContent = 'Please wait…';
  google.script.run.withSuccessHandler(function (res) {
    if (res.success) {
      STATE = Object.assign({}, res.state, { rosterCode: res.rosterCode, requiresGeofence: res.requiresGeofence });
      renderMe();
      const msg = document.getElementById('msg');
      if (msg) msg.innerHTML = '<div class="status ok">Recorded at ' + res.time + '.</div>';
    } else {
      renderMe();
      const msg = document.getElementById('msg');
      if (msg) msg.innerHTML = '<div class="status err">' + res.message + '</div>';
    }
  }).withFailureHandler(function (err) {
    renderMe();
    const msg = document.getElementById('msg');
    if (msg) msg.innerHTML = '<div class="status err">' + err.message + '</div>';
  }).recordEvent(type, LAST_LOC ? LAST_LOC.lat : null, LAST_LOC ? LAST_LOC.lng : null);
}

function renderTeam() {
  if (ACTIVE_TAB !== 'team') return;
  const body = document.getElementById('tabBody');
  if (!body) return;
  if (!TEAM) {
    body.innerHTML = '<div class="loading">Loading team status…</div>';
    return;
  }
  let html = '<div class="card"><h1>Team Status</h1><div class="sub">Live · updates every 20s · as of ' + new Date(TEAM.asOf).toLocaleTimeString() + '</div>';
  TEAM.employees.forEach(function (e) {
    const cls = 'st-' + String(e.status || '').replace(/\s+/g, '');
    html += '<div class="team-row"><div><div class="team-name">' + e.name + '</div><div class="team-sub">' + (e.department || '') +
      (e.punchIn ? ' · in ' + fmtTime(e.punchIn) : '') + (e.punchOut ? ' · out ' + fmtTime(e.punchOut) : '') + '</div></div>' +
      '<span class="status-pill ' + cls + '">' + (e.status || '—') + '</span></div>';
  });
  html += '</div>';

  html += '<div class="card"><h1>Recent Activity</h1><div class="sub">Last ' + (RECENT_LOG ? RECENT_LOG.length : 0) + ' punch/break events</div>';
  if (!RECENT_LOG) {
    html += '<div class="loading">Loading…</div>';
  } else if (!RECENT_LOG.length) {
    html += '<div class="sub">No activity yet today.</div>';
  } else {
    RECENT_LOG.forEach(function (e) {
      html += '<div class="team-row"><div><div class="team-name">' + e.name + '</div><div class="team-sub">' + e.label + '</div></div>' +
        '<div class="team-sub">' + fmtTime(e.timestamp) + '</div></div>';
    });
  }
  html += '</div>';

  body.innerHTML = html;
}

function loadTeam() {
  google.script.run.withSuccessHandler(function (t) { TEAM = t; renderTeam(); })
    .withFailureHandler(function (err) {
      const body = document.getElementById('tabBody');
      if (body && ACTIVE_TAB === 'team') body.innerHTML = '<div class="card status err">' + err.message + '</div>';
    })
    .getTeamStatus();
  google.script.run.withSuccessHandler(function (log) { RECENT_LOG = log; renderTeam(); })
    .withFailureHandler(function () { /* non-fatal — Team Status card still shows */ })
    .getRecentLog(30);
}

boot();
</script>
</body>
</html>
